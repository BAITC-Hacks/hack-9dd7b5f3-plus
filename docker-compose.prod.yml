# Production override for the demo server (bagyt.plus):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile server up -d --build
# Caddy terminates HTTPS for bagyt.plus / api. / voice. and proxies to the containers.
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - frontend
      - backend

  backend:
    environment:
      CORS_ORIGINS: ${CORS_ORIGINS:-https://bagyt.plus,https://www.bagyt.plus}

  frontend:
    restart: unless-stopped
    ports: !reset []

  voice:
    environment:
      VOICE_PUBLIC_URL: https://voice.bagyt.plus
      VOICE_ALLOWED_ORIGINS: https://bagyt.plus,https://www.bagyt.plus,https://voice.bagyt.plus

volumes:
  caddy-data:
  caddy-config:
