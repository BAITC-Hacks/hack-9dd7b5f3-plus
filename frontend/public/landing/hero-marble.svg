<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <filter id="marble" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.0018 0.003" numOctaves="4" seed="4" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.184  0 0 0 0 0.416  0 0 0 0 0.820  0 0 0 8 -3.6" result="blobs"/>
      <feGaussianBlur in="blobs" stdDeviation="1"/>
    </filter>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity="1"/></linearGradient>
  </defs>
  <rect width="1600" height="900" fill="#ffffff"/>
  <rect width="1600" height="900" filter="url(#marble)"/>
</svg>
