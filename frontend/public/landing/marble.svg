<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <filter id="marble" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.0016 0.0032" numOctaves="5" seed="23" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.93  0 0 0 0 0.96  0 0 0 0 1  0 0 0 14 -6.1" result="veins"/>
      <feGaussianBlur in="veins" stdDeviation="7" result="soft"/>
      <feMerge><feMergeNode in="soft"/><feMergeNode in="veins"/></feMerge>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="#0b1224"/>
  <rect width="1600" height="900" filter="url(#marble)"/>
</svg>
